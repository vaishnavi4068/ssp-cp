openapi: 3.1.0
info:
  title: SSP Control Plane API
  version: 1.0.0
  description: >
    Self-Service Platform control plane. Generated Go server lives in ssp-cp/internal/api/gen.
    Requirement IDs (SSP-API-*) are in ssp-doc/10-product/12-api-spec.md.
servers:
  - url: https://ssp.{env}.internal/v1
    variables: { env: { default: sandbox, enum: [sandbox, nonprod, prod] } }
security:
  - bearerAuth: []
tags:
  - { name: catalog }
  - { name: destinations }
  - { name: orders }
  - { name: resources }
  - { name: runs }
  - { name: ops }
  - { name: imports }
  - { name: assistant }
paths:
  /catalog/services:
    get:
      tags: [catalog]
      operationId: listServices
      parameters:
        - { name: cloud, in: query, schema: { $ref: '#/components/schemas/Cloud' } }
        - { name: category, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string, enum: [name, frequent] } }
        - { $ref: '#/components/parameters/PageSize' }
        - { $ref: '#/components/parameters/PageToken' }
      responses:
        '200':
          description: Services
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ServiceSummary' } }
                  next_page_token: { type: string }
  /catalog/services/{service_id}:
    get:
      tags: [catalog]
      operationId: getService
      parameters: [{ $ref: '#/components/parameters/ServiceId' }]
      responses:
        '200': { description: Service, content: { application/json: { schema: { $ref: '#/components/schemas/ServiceDetail' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /catalog/services/{service_id}/versions/{version}:
    get:
      tags: [catalog]
      operationId: getServiceVersion
      parameters: [{ $ref: '#/components/parameters/ServiceId' }, { name: version, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Service version, content: { application/json: { schema: { $ref: '#/components/schemas/ServiceDetail' } } } }
  /destinations:
    get:
      tags: [destinations]
      operationId: listDestinations
      responses:
        '200':
          description: Entitled tenant boundaries
          content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Destination' } } } } } }
  /destinations/{tenant_id}/context:
    get:
      tags: [destinations]
      operationId: getDestinationContext
      parameters: [{ $ref: '#/components/parameters/TenantId' }]
      responses:
        '200': { description: Context, content: { application/json: { schema: { $ref: '#/components/schemas/TenantContext' } } } }
  /orders/preflight:
    post:
      tags: [orders]
      operationId: preflightOrder
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OrderInput' } } } }
      responses:
        '200': { description: Preflight result, content: { application/json: { schema: { $ref: '#/components/schemas/PreflightResult' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /orders:
    post:
      tags: [orders]
      operationId: createOrder
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: '#/components/schemas/OrderInput' }
                - { type: object, required: [preview_hash], properties: { preview_hash: { type: string } } }
      responses:
        '202': { description: Accepted, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    get:
      tags: [orders]
      operationId: listOrders
      parameters:
        - { name: tenant_id, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { $ref: '#/components/schemas/OrderState' } }
        - { name: mine, in: query, schema: { type: boolean } }
        - { $ref: '#/components/parameters/PageSize' }
        - { $ref: '#/components/parameters/PageToken' }
      responses:
        '200': { description: Orders, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Order' } }, next_page_token: { type: string } } } } } }
  /orders/{order_id}:
    get:
      tags: [orders]
      operationId: getOrder
      parameters: [{ $ref: '#/components/parameters/OrderId' }]
      responses:
        '200': { description: Order, content: { application/json: { schema: { $ref: '#/components/schemas/OrderDetail' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /orders/{order_id}/events:
    get:
      tags: [orders]
      operationId: streamOrderEvents
      parameters: [{ $ref: '#/components/parameters/OrderId' }, { name: Last-Event-ID, in: header, schema: { type: string } }]
      responses:
        '200': { description: SSE stream of OrderEvent, content: { text/event-stream: { schema: { type: string } } } }
  /orders/{order_id}/code:
    get:
      tags: [orders]
      operationId: getOrderCode
      parameters: [{ $ref: '#/components/parameters/OrderId' }]
      responses:
        '200': { description: Equivalent code, content: { application/json: { schema: { $ref: '#/components/schemas/CodeView' } } } }
  /orders/{order_id}/cancel:
    post:
      tags: [orders]
      operationId: cancelOrder
      parameters: [{ $ref: '#/components/parameters/OrderId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200': { description: Cancelled, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
        '409': { $ref: '#/components/responses/Problem' }
  /orders/{order_id}/signoff:
    post:
      tags: [orders]
      operationId: signoffOrder
      parameters: [{ $ref: '#/components/parameters/OrderId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { note: { type: string } } } } } }
      responses:
        '200': { description: Signed off, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
  /tenants/{tenant_id}/resources:
    get:
      tags: [resources]
      operationId: listTenantResources
      parameters: [{ $ref: '#/components/parameters/TenantId' }]
      responses:
        '200': { description: Resources, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/ResourceInstance' } } } } } } }
  /resources/{resource_instance_id}:
    get:
      tags: [resources]
      operationId: getResource
      parameters: [{ name: resource_instance_id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Resource, content: { application/json: { schema: { $ref: '#/components/schemas/ResourceDetail' } } } }
  /tenants/{tenant_id}/drift:
    get:
      tags: [resources]
      operationId: listTenantDrift
      parameters: [{ $ref: '#/components/parameters/TenantId' }]
      responses:
        '200': { description: Drift findings, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/DriftFinding' } } } } } } }
  /runs:
    get:
      tags: [runs]
      operationId: listRuns
      parameters: [{ name: tenant_id, in: query, required: true, schema: { type: string } }, { $ref: '#/components/parameters/PageSize' }, { $ref: '#/components/parameters/PageToken' }]
      responses:
        '200': { description: Runs, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Run' } }, next_page_token: { type: string } } } } } }
  /runs/{run_id}:
    get:
      tags: [runs]
      operationId: getRun
      parameters: [{ $ref: '#/components/parameters/RunId' }]
      responses:
        '200': { description: Run, content: { application/json: { schema: { $ref: '#/components/schemas/Run' } } } }
  /runs/{run_id}/logs:
    get:
      tags: [runs]
      operationId: getRunLogs
      parameters: [{ $ref: '#/components/parameters/RunId' }]
      responses:
        '200': { description: Redacted log, content: { text/plain: { schema: { type: string } } } }
  /runs/{run_id}/retry:
    post:
      tags: [ops]
      operationId: retryRun
      parameters: [{ $ref: '#/components/parameters/RunId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '202': { description: Retry signalled }
  /ops/fleet:
    get:
      tags: [ops]
      operationId: getFleet
      responses:
        '200': { description: Fleet status, content: { application/json: { schema: { $ref: '#/components/schemas/FleetStatus' } } } }
  /ops/tenants:
    get:
      tags: [ops]
      operationId: listOpsTenants
      parameters: [{ name: lob, in: query, schema: { type: string } }, { name: paused, in: query, schema: { type: boolean } }, { name: drifted, in: query, schema: { type: boolean } }]
      responses:
        '200': { description: Tenants, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/TenantOps' } } } } } } }
  /ops/controls/pause:
    post:
      tags: [ops]
      operationId: pauseScope
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ControlRequest' } } } }
      responses: { '200': { description: Paused } }
  /ops/controls/resume:
    post:
      tags: [ops]
      operationId: resumeScope
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ControlRequest' } } } }
      responses: { '200': { description: Resumed } }
  /ops/controls/killswitch:
    post:
      tags: [ops]
      operationId: killSwitch
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope, confirm, reason]
              properties:
                scope: { type: string, enum: [platform_sa] }
                confirm: { type: string, description: must equal scope }
                reason: { type: string }
                approval_token: { type: string, description: from the first operator's call }
      responses:
        '202': { description: First approval recorded; returns approval_token }
        '200': { description: Platform SA disabled }
  /ops/tenants/{tenant_id}/reconcile:
    post:
      tags: [ops]
      operationId: forceReconcile
      parameters: [{ $ref: '#/components/parameters/TenantId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '202': { description: Signalled } }
  /ops/tenants/{tenant_id}/drift-scan:
    post:
      tags: [ops]
      operationId: forceDriftScan
      parameters: [{ $ref: '#/components/parameters/TenantId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '202': { description: Signalled } }
  /ops/tenants/{tenant_id}/break-glass:
    post:
      tags: [ops]
      operationId: setBreakGlass
      parameters: [{ $ref: '#/components/parameters/TenantId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [until, incident], properties: { until: { type: string, format: date-time }, incident: { type: string } } } } } }
      responses: { '200': { description: Set } }
  /imports:
    post:
      tags: [imports]
      operationId: createImport
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ImportRequest' } } } }
      responses: { '202': { description: Import created, content: { application/json: { schema: { $ref: '#/components/schemas/ImportJob' } } } } }
  /imports/{import_id}:
    get:
      tags: [imports]
      operationId: getImport
      parameters: [{ $ref: '#/components/parameters/ImportId' }]
      responses: { '200': { description: Import, content: { application/json: { schema: { $ref: '#/components/schemas/ImportJob' } } } } }
  /imports/{import_id}/mapping:
    put:
      tags: [imports]
      operationId: putImportMapping
      parameters: [{ $ref: '#/components/parameters/ImportId' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/ImportMapping' } } } } } } }
      responses: { '200': { description: Saved } }
  /imports/{import_id}/dry-run:
    post:
      tags: [imports]
      operationId: dryRunImport
      parameters: [{ $ref: '#/components/parameters/ImportId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '202': { description: Dry run started } }
  /imports/{import_id}/execute:
    post:
      tags: [imports]
      operationId: executeImport
      parameters: [{ $ref: '#/components/parameters/ImportId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '202': { description: Import run started } }
  /assistant/conversations:
    post:
      tags: [assistant]
      operationId: createConversation
      requestBody: { content: { application/json: { schema: { type: object, properties: { tenant_id: { type: string }, surface: { type: string, enum: [storefront, control_room] } } } } } }
      responses: { '201': { description: Created, content: { application/json: { schema: { type: object, properties: { conversation_id: { type: string } } } } } } }
  /assistant/conversations/{conversation_id}/messages:
    post:
      tags: [assistant]
      operationId: sendMessage
      parameters: [{ name: conversation_id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [text], properties: { text: { type: string }, context: { type: object, additionalProperties: true } } } } } }
      responses: { '200': { description: SSE stream of assistant events, content: { text/event-stream: { schema: { type: string } } } } }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    PageSize: { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
    PageToken: { name: page_token, in: query, schema: { type: string } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 128 } }
    ServiceId: { name: service_id, in: path, required: true, schema: { type: string, pattern: '^(gcp|aws|azure)\.[a-z0-9-]+$' } }
    TenantId: { name: tenant_id, in: path, required: true, schema: { type: string } }
    OrderId: { name: order_id, in: path, required: true, schema: { type: string, pattern: '^ord_[0-9A-HJKMNP-TV-Z]{26}$' } }
    RunId: { name: run_id, in: path, required: true, schema: { type: string } }
    ImportId: { name: import_id, in: path, required: true, schema: { type: string } }
  responses:
    Problem:
      description: RFC 9457 problem
      content:
        application/problem+json:
          schema:
            type: object
            required: [type, title, status]
            properties:
              type: { type: string, format: uri }
              title: { type: string }
              status: { type: integer }
              detail: { type: string }
              instance: { type: string }
              errors: { type: array, items: { type: object, properties: { field: { type: string }, message: { type: string }, rule_id: { type: string } } } }
  schemas:
    Cloud: { type: string, enum: [gcp, aws, azure] }
    OrderKind: { type: string, enum: [create, change, decommission, upgrade, adopt, import] }
    OrderState: { type: string, enum: [requested, approved, expected, observed, rejected, cancelled, failed] }
    Money:
      type: object
      required: [currency, amount]
      properties: { currency: { type: string, default: USD }, amount: { type: string, pattern: '^-?[0-9]+(\.[0-9]{1,4})?$' } }
    ServiceSummary:
      type: object
      required: [service_id, cloud, display_name, category, version, starting_price]
      properties:
        service_id: { type: string }
        cloud: { $ref: '#/components/schemas/Cloud' }
        display_name: { type: string }
        category: { type: string }
        description: { type: string }
        version: { type: string }
        starting_price: { $ref: '#/components/schemas/Money' }
        tags: { type: array, items: { type: string } }
    ServiceDetail:
      allOf:
        - { $ref: '#/components/schemas/ServiceSummary' }
        - type: object
          required: [request_schema, ui_template, guardrails, pricing]
          properties:
            request_schema: { type: object, additionalProperties: true, description: JSON Schema 2020-12 }
            ui_template: { type: object, additionalProperties: true }
            guardrails: { type: array, items: { $ref: '#/components/schemas/Guardrail' } }
            pricing: { type: object, additionalProperties: true }
            docs_url: { type: string, format: uri }
            adr_id: { type: string }
    Guardrail:
      type: object
      required: [id, field, mode]
      properties:
        id: { type: string, description: requirement id e.g. REQ-E-SPAN-0001-02 }
        field: { type: string, description: JSON pointer in params }
        mode: { type: string, enum: [inject, deny, warn] }
        value: {}
        when: { type: string, description: CEL expression over context }
        relaxable: { type: boolean, default: false }
        source: { type: string }
    Destination:
      type: object
      required: [tenant_id, cloud, kind, boundary_ref, display_name, apm_id, tier, data_class, env, role]
      properties:
        tenant_id: { type: string }
        cloud: { $ref: '#/components/schemas/Cloud' }
        kind: { type: string, enum: [project, account, subscription] }
        boundary_ref: { type: string }
        display_name: { type: string }
        region_default: { type: string }
        apm_id: { type: string }
        tier: { type: integer }
        data_class: { type: string }
        env: { type: string }
        role: { type: string, enum: [buyer, app_owner] }
        lob_id: { type: string }
    TenantContext:
      type: object
      properties:
        tenant: { $ref: '#/components/schemas/Destination' }
        apm: { type: object, properties: { apm_id: { type: string }, name: { type: string }, tier: { type: integer }, data_class: { type: string }, cost_center: { type: string }, owner_email: { type: string } } }
        quotas: { type: object, additionalProperties: true }
        budget: { type: object, properties: { monthly_limit: { $ref: '#/components/schemas/Money' }, committed: { $ref: '#/components/schemas/Money' }, headroom: { $ref: '#/components/schemas/Money' } } }
        paused: { type: boolean }
    OrderInput:
      type: object
      required: [tenant_id, service_id, kind, params]
      properties:
        tenant_id: { type: string }
        service_id: { type: string }
        version: { type: string, description: catalog bundle version; default latest }
        kind: { $ref: '#/components/schemas/OrderKind' }
        resource_instance_id: { type: string }
        name: { type: string, description: stable resource name; required for create }
        params: { type: object, additionalProperties: true }
        channel: { type: string, enum: [ui, api, chat, migrate, release], default: api }
    PreflightResult:
      type: object
      required: [approved_params, guardrails, policy, estimate, code, gates, preview_hash, valid_until]
      properties:
        approved_params: { type: object, additionalProperties: true }
        guardrails: { type: array, items: { $ref: '#/components/schemas/GuardrailApplied' } }
        policy: { $ref: '#/components/schemas/PolicyDecision' }
        estimate: { $ref: '#/components/schemas/Estimate' }
        code: { $ref: '#/components/schemas/CodeView' }
        gates: { type: array, items: { type: string, enum: [cr_required, owner_signoff_required, budget_exceeded, quota_exceeded, tenant_paused] } }
        preview_hash: { type: string }
        valid_until: { type: string, format: date-time }
        eta_seconds_p50: { type: integer }
    GuardrailApplied:
      allOf:
        - { $ref: '#/components/schemas/Guardrail' }
        - type: object
          properties:
            applied: { type: boolean }
            previous_value: {}
            reason: { type: string }
    PolicyDecision:
      type: object
      required: [bundle_digest, result]
      properties:
        bundle_digest: { type: string }
        result: { type: string, enum: [allow, deny, warn] }
        rules: { type: array, items: { type: object, properties: { id: { type: string }, result: { type: string }, message: { type: string }, requirement_id: { type: string } } } }
    Estimate:
      type: object
      required: [monthly_total, lines, pricing_version, disclaimer]
      properties:
        monthly_total: { $ref: '#/components/schemas/Money' }
        lines: { type: array, items: { type: object, properties: { label: { type: string }, quantity: { type: string }, unit: { type: string }, monthly: { $ref: '#/components/schemas/Money' } } } }
        pricing_version: { type: string }
        disclaimer: { type: string }
    CodeView:
      type: object
      required: [terraform, cli, module_source, module_version]
      properties:
        terraform: { type: string }
        cli: { type: string }
        module_source: { type: string }
        module_version: { type: string }
    Order:
      type: object
      required: [order_id, kind, state, gate, tenant_id, service_id, service_version, requested_by, created_at, updated_at]
      properties:
        order_id: { type: string }
        kind: { $ref: '#/components/schemas/OrderKind' }
        state: { $ref: '#/components/schemas/OrderState' }
        gate: { type: string, enum: [none, cr_pending, owner_signoff_pending] }
        tenant_id: { type: string }
        service_id: { type: string }
        service_version: { type: string }
        resource_instance_id: { type: string }
        name: { type: string }
        requested_by: { type: string }
        requested_params: { type: object, additionalProperties: true }
        channel: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    OrderDetail:
      allOf:
        - { $ref: '#/components/schemas/Order' }
        - type: object
          properties:
            approved: { type: object, properties: { approved_params: { type: object, additionalProperties: true }, guardrails: { type: array, items: { $ref: '#/components/schemas/GuardrailApplied' } }, policy: { $ref: '#/components/schemas/PolicyDecision' }, estimate: { $ref: '#/components/schemas/Estimate' }, cr_id: { type: string }, approved_by: { type: string }, approved_at: { type: string, format: date-time } } }
            latest_run: { $ref: '#/components/schemas/Run' }
            post_build: { type: array, items: { type: object, properties: { step: { type: string }, state: { type: string }, receipt: { type: object, additionalProperties: true } } } }
            events: { type: array, items: { $ref: '#/components/schemas/OrderEvent' } }
    OrderEvent:
      type: object
      required: [event_id, order_id, at, actor, type]
      properties:
        event_id: { type: integer }
        order_id: { type: string }
        at: { type: string, format: date-time }
        actor: { type: string }
        from_state: { $ref: '#/components/schemas/OrderState' }
        to_state: { $ref: '#/components/schemas/OrderState' }
        type: { type: string }
        detail: { type: object, additionalProperties: true }
    ResourceInstance:
      type: object
      required: [resource_instance_id, tenant_id, service_id, service_version, name, state]
      properties:
        resource_instance_id: { type: string }
        tenant_id: { type: string }
        service_id: { type: string }
        service_version: { type: string }
        name: { type: string }
        state: { type: string, enum: [expected, observed, drifted, decommissioning, removed] }
        outputs: { type: object, additionalProperties: true }
        last_observed_at: { type: string, format: date-time }
    ResourceDetail:
      allOf:
        - { $ref: '#/components/schemas/ResourceInstance' }
        - type: object
          properties:
            params: { type: object, additionalProperties: true }
            drift: { type: array, items: { $ref: '#/components/schemas/DriftFinding' } }
            orders: { type: array, items: { $ref: '#/components/schemas/Order' } }
            code: { $ref: '#/components/schemas/CodeView' }
    DriftFinding:
      type: object
      required: [finding_id, tenant_id, class, detected_at]
      properties:
        finding_id: { type: string }
        tenant_id: { type: string }
        resource_instance_id: { type: string }
        class: { type: string, enum: [benign, config, missing, unmanaged] }
        detail: { type: object, additionalProperties: true }
        detected_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time }
        resolution: { type: string }
    Run:
      type: object
      required: [run_id, tenant_id, generation, kind, state, attempt, job_name, workflow_id]
      properties:
        run_id: { type: string }
        tenant_id: { type: string }
        generation: { type: integer }
        kind: { type: string, enum: [plan, apply, refresh, import, destroy] }
        state: { type: string, enum: [queued, running, succeeded, failed, cancelled] }
        attempt: { type: integer }
        job_name: { type: string }
        workflow_id: { type: string }
        order_ids: { type: array, items: { type: string } }
        plan_summary: { type: object, properties: { add: { type: integer }, change: { type: integer }, destroy: { type: integer }, replace: { type: integer } } }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        error: { type: string }
    FleetStatus:
      type: object
      properties:
        orders_by_state: { type: object, additionalProperties: { type: integer } }
        queues: { type: array, items: { type: object, properties: { lob_id: { type: string }, depth: { type: integer }, oldest_age_seconds: { type: integer } } } }
        workers: { type: array, items: { type: object, properties: { task_queue: { type: string }, pollers: { type: integer }, healthy: { type: boolean } } } }
        temporal: { type: object, properties: { namespace: { type: string }, healthy: { type: boolean } } }
        controls: { type: array, items: { type: object, properties: { scope: { type: string }, paused: { type: boolean }, reason: { type: string } } } }
        platform_sa_enabled: { type: boolean }
        drift_open: { type: integer }
    TenantOps:
      type: object
      properties:
        tenant_id: { type: string }
        lob_id: { type: string }
        apm_id: { type: string }
        env: { type: string }
        paused: { type: boolean }
        queue_depth: { type: integer }
        last_run: { $ref: '#/components/schemas/Run' }
        drift_open: { type: integer }
        break_glass_until: { type: string, format: date-time }
    ControlRequest:
      type: object
      required: [scope, reason]
      properties:
        scope: { type: string, pattern: '^(global|lob:[a-z0-9-]+|tenant:[a-z0-9:-]+)$' }
        reason: { type: string }
    ImportRequest:
      type: object
      required: [source]
      properties:
        source: { type: object, properties: { cloud: { $ref: '#/components/schemas/Cloud' }, boundary_ref: { type: string }, legacy_layout: { type: string, enum: ['1.0', '2.0'] } } }
        scope: { type: object, properties: { services: { type: array, items: { type: string } }, labels: { type: object, additionalProperties: { type: string } } } }
    ImportJob:
      type: object
      properties:
        import_id: { type: string }
        state: { type: string, enum: [inventorying, mapping, dry_run, ready, executing, done, failed] }
        inventory: { type: array, items: { type: object, properties: { asset_id: { type: string }, type: { type: string }, name: { type: string }, labels: { type: object, additionalProperties: { type: string } }, suggested_service_id: { type: string }, confidence: { type: number } } } }
        mapping: { type: array, items: { $ref: '#/components/schemas/ImportMapping' } }
        dry_run: { type: object, properties: { run_id: { type: string }, zero_changes: { type: boolean }, diff_summary: { type: object, additionalProperties: true } } }
    ImportMapping:
      type: object
      required: [asset_id, decision]
      properties:
        asset_id: { type: string }
        decision: { type: string, enum: [import, skip, flag] }
        service_id: { type: string }
        name: { type: string }
        params: { type: object, additionalProperties: true }
        note: { type: string }
