apiVersion: apps/v1
kind: Deployment
metadata:
  name: ssp-cp-api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: ssp-cp-api
  template:
    metadata:
      labels:
        app: ssp-cp-api
    spec:
      serviceAccountName: ssp-cp-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.httpPort }}
          envFrom:
            - configMapRef:
                name: ssp-cp
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
