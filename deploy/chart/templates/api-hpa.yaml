apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ssp-cp-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ssp-cp-api
  minReplicas: {{ .Values.api.replicas }}
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
