apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ssp-cp-default-deny
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ssp-cp-api-ingress
spec:
  podSelector:
    matchLabels:
      app: ssp-cp-api
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: {{ .Values.httpPort }}
