{{- if .Values.opa.enabled }}
---
# Plain OPA Server Deployment (explicitly NOT OPA Gatekeeper) in dedicated namespace `spp-policy` (`WI-003`)
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.opa.namespace }}
  labels:
    kubernetes.io/metadata.name: {{ .Values.opa.namespace }}
    app.kubernetes.io/part-of: spp-policy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.opa.serviceName }}
  namespace: {{ .Values.opa.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.opa.serviceName }}
    app.kubernetes.io/part-of: spp-policy
spec:
  replicas: {{ .Values.opa.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.opa.serviceName }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.opa.serviceName }}
        app.kubernetes.io/part-of: spp-policy
    spec:
      nodeSelector:
        {{- toYaml .Values.global.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.global.tolerations | nindent 8 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: opa
          image: {{ .Values.images.opaImage | quote }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          args:
            - "run"
            - "--server"
            - "--addr=0.0.0.0:{{ .Values.opa.port }}"
            - "--log-format=json"
            - "/policies"
          ports:
            - containerPort: {{ .Values.opa.port }}
              name: http
          volumeMounts:
            - name: opa-policies
              mountPath: /policies
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.opa.port }}
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.opa.port }}
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: opa-policies
          configMap:
            name: spp-opa-policies
---
# Internal-only ClusterIP Service for OPA (zero public ingress)
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.opa.serviceName }}
  namespace: {{ .Values.opa.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.opa.serviceName }}
    app.kubernetes.io/part-of: spp-policy
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ .Values.opa.serviceName }}
  ports:
    - name: http
      port: {{ .Values.opa.port }}
      targetPort: {{ .Values.opa.port }}
---
# NetworkPolicy: only pods in namespace `spp-platform` (`ssp-cp` and `ssp-workers`) may reach OPA on :8181
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: spp-opa-allow-platform-only
  namespace: {{ .Values.opa.namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.opa.serviceName }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.global.namespace }}
      ports:
        - protocol: TCP
          port: {{ .Values.opa.port }}
  egress: []
{{- end }}
